name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Instalar dependências
        run: uv sync --locked
      - name: Lint e formatação
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Testes
        run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=90
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
          SECRET_KEY: ci-nao-e-segredo
      - name: Check de deploy
        # O settings de produção sem nenhum aviso (SA-53); a chave é aleatória a
        # cada execução e nunca sai do job.
        run: |
          SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            uv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
          ALLOWED_HOSTS: salas-api-9arthur.fly.dev

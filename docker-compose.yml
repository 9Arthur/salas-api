services:
  db:
    image: mirror.gcr.io/library/postgres:17
    environment:
      POSTGRES_USER: salas
      POSTGRES_PASSWORD: salas
      POSTGRES_DB: salas
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salas -d salas"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
